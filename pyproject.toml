
[project]
name = "kalman"
version = "0.1"
description = "This project is meant for computing Kalman filter with various standalone example cases"
readme = "README.md"
license = { file = "LICENSE" }

[project.urls]
homepage = "https://max-planck.sv.yc.tcu.ac.jp/kagra/sus/kalman-framework"

[project.optional-dependencies]
test = ["unittest"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "kalman" = "modules" }  # Escaping curly braces
packages = [
	"kalman",
	"kalman.core",
	"kalman.models"
]
