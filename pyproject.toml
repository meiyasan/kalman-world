
[project]
name = "kalman"
version = "1.0.0"
description = "This project is meant for computing Kalman filter with various standalone example cases"
readme = "README.md"
license = { text = "LGPL-2.1-or-later" }

[project.urls]
homepage = "https://github.com/meiyasan/kalman-world"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "coverage>=7", "ruff>=0.6"]
mcp = ["mcp>=1.0"]
rest = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
auth = ["bcrypt>=4.0", "pyjwt>=2.0"]
remote = ["httpx>=0.27"]
all = ["mcp>=1.0", "fastapi>=0.110", "uvicorn[standard]>=0.29",
       "bcrypt>=4.0", "pyjwt>=2.0", "httpx>=0.27"]

[project.scripts]
kalman-mcp = "kalman.mcp.__main__:main"
kalman-rest = "kalman.rest.__main__:main"

[build-system]
requires = ["setuptools", "wheel", "cffi>=1.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["modules"]
# runtime/* is logging/timing infrastructure, not core filter/model logic.
omit = ["modules/runtime/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["var", "share", ".venv"]

[tool.ruff.lint]
# House style in this Kalman codebase is deliberate: compact one-liners (E701/E702) and
# single-letter mathematical names (n, m, l, F, H, Q, R ...; E741). Lint for correctness
# (pyflakes + syntax) rather than cosmetics, and allow the intentional `from helpers import *`.
select = ["E9", "F"]
ignore = ["F403", "F405"]

[tool.setuptools]
package-dir = { "kalman" = "modules" }  # Escaping curly braces
packages = [
	"kalman",
	"kalman.runtime",
	"kalman.framework",
	"kalman.framework.abstract",
	"kalman.framework.io",
	"kalman.framework.engines",
	"kalman.framework.models",
	"kalman.framework.controllers",
	"kalman.framework.routers",
	"kalman.framework.routers.nn",
	"kalman.framework.native",
	"kalman.framework.filters",
	"kalman.apps",
	"kalman.apps.weather",
	"kalman.apps.weather.providers",
	"kalman.framework.integrators",
	"kalman.framework.solvers",
	"kalman.providers",
	"kalman.api",
	"kalman.mcp",
	"kalman.rest",
]
