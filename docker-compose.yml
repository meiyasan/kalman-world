networks:
  extranet:
    name: "${CONTAINER:-docker}-extranet"
  intranet:
    name: "${CONTAINER:-docker}-intranet"
    internal: true

volumes:
  conda: {name: "${CONTAINER:-docker}-conda"}
  # The shared registry (models, plugins, sources, events): survives restarts.
  state: {name: "${CONTAINER:-docker}-state"}

services:
  container:
    container_name: ${CONTAINER:-docker}-container
    platform: ${PLATFORM:-linux/amd64}
    networks:
      - extranet
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      - .dockerenv
    volumes:
      - $HOME/.ssh:/root/.ssh:ro
      - $HOME/.ssh/known_hosts:/root/.ssh/known_hosts:rw
      - $HOME/.gitconfig:/root/.gitconfig:ro
      - conda:/opt/conda/envs

      - ./var/container:/root:rw
      - ./.bashrc:/root/.bashrc:ro
      - ./.condarc:/root/.condarc:ro
      - ./.env:/root/.env:ro

      - ./:/mnt/local:ro
      - ./.git:/mnt/local/.git:rw
      - ./.virtualenv:/mnt/local/.virtualenv:rw
      - ./build:/mnt/local/build:rw
      - ./public:/mnt/local/public:rw
      - ./pyproject.toml:/mnt/local/pyproject.toml:rw
      - ./tests:/mnt/local/tests:rw
      - ./tools:/mnt/local/tools:rw
      - ./examples:/mnt/local/examples:rw
      - ./vendor:/mnt/local/vendor:rw
      - ./var:/mnt/local/var:rw

    entrypoint: /mnt/local/entrypoint.sh

  # ---- REST API (FastAPI/uvicorn) over the kalman.api facade ----
  rest:
    container_name: ${CONTAINER:-docker}-rest
    platform: ${PLATFORM:-linux/amd64}
    networks:
      - extranet
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - KALMAN_REST_HOST=0.0.0.0
      - KALMAN_REST_PORT=8000
      - KALMAN_JWT_SECRET=${KALMAN_JWT_SECRET:-}
      - KALMAN_JWT_ISSUER=${KALMAN_JWT_ISSUER:-}
      - KALMAN_JWT_AUDIENCE=${KALMAN_JWT_AUDIENCE:-}
      - KALMAN_HTPASSWD=/run/secrets/htpasswd
      - KALMAN_STATE_DIR=/var/lib/kalman
      # Browser clients (Unity WebGL, dashboards): comma-separated origins, or "*".
      - KALMAN_CORS_ORIGINS=${KALMAN_CORS_ORIGINS:-}
      # Without KALMAN_JWT_SECRET the API refuses to start on 0.0.0.0; set this
      # to 1 only on a network you trust.
      - KALMAN_ALLOW_ANONYMOUS=${KALMAN_ALLOW_ANONYMOUS:-0}
    volumes:
      - ./:/mnt/local:ro
      - state:/var/lib/kalman
      - ${KALMAN_HTPASSWD:-/dev/null}:/run/secrets/htpasswd:ro
    working_dir: /mnt/local
    command: ["python", "-m", "kalman.rest"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # ---- MCP server (SSE transport in the container) ----
  mcp:
    container_name: ${CONTAINER:-docker}-mcp
    platform: ${PLATFORM:-linux/amd64}
    networks:
      - extranet
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # A client of the REST API: one registry, one set of runs, and the tokens
    # are checked there -- so this container does not get the JWT secret.
    environment:
      - KALMAN_MCP_TRANSPORT=${KALMAN_MCP_TRANSPORT:-sse}
      - KALMAN_MCP_HOST=0.0.0.0
      - KALMAN_MCP_PORT=8765
      - KALMAN_MCP_PUBLIC_URL=${KALMAN_MCP_PUBLIC_URL:-http://localhost:8765}
      - KALMAN_API_URL=http://rest:8000
      - KALMAN_ALLOW_ANONYMOUS=${KALMAN_ALLOW_ANONYMOUS:-0}
    depends_on:
      rest:
        condition: service_healthy
    volumes:
      - ./:/mnt/local:ro
    working_dir: /mnt/local
    command: ["python", "-m", "kalman.mcp"]
    ports:
      - "8765:8765"
